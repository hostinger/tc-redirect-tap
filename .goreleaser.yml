---
version: 2

builds:
- id: tc-redirect-tap
  main: ./cmd/tc-redirect-tap
  binary: tc-redirect-tap
  env:
  - CGO_ENABLED=0
  ldflags:
  - -s -w -X github.com/containernetworking/plugins/pkg/utils/buildversion.BuildVersion={{ .Version }}
  goos:
  - linux
  goarch:
  - amd64
  - arm64

# Raw binaries named tc-redirect-tap-<arch>, the asset names installers download.
archives:
- id: tc-redirect-tap
  ids:
  - tc-redirect-tap
  formats:
  - binary
  name_template: tc-redirect-tap-{{ .Arch }}

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  draft: true

changelog:
  sort: asc
